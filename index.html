    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="description" content="MonEra: tus finanzas personales, fluidas y sin esfuerzo." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MonEra</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello blanco en modo oscuro)
      try {
        var t = localStorage.getItem('monera-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#0f0d16')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
