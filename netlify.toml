# Configuración de despliegue en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app usa rutas del navegador (/cuentas, /reportes…): cualquier ruta
# debe servir index.html; si no, al recargar una página sale error 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el manifest deben revisarse siempre (si no, la app instalada tardaría en actualizarse)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
